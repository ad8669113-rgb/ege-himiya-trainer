<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Линия 20 — Электролиз</title>
<style>
:root{--bg:#F0F9FF;--card:#fff;--border:#BAE6FD;--accent:#0284C7;--text:#0F172A;--muted:#64748B;--hero:#0C1B33;--green:#16A34A;--red:#DC2626;--gbg:#F0FDF4;--rbg:#FEF2F2;--amber:#D97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.hero{background:var(--hero);color:#fff;padding:16px 20px 12px;text-align:center;flex-shrink:0}
.hero-title{font-size:clamp(14px,3.5vw,21px);font-weight:700}
.hero-sub{font-size:11px;color:#93C5FD;margin-top:2px}
.timer-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.timer{font-size:24px;font-weight:700;font-family:'Courier New',monospace;color:#7DD3FC;letter-spacing:3px}
.stats-row{display:flex;justify-content:center;gap:16px;margin-top:6px;font-size:12px;color:#93C5FD;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:5px}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.pct{font-weight:800;color:#FCD34D;font-size:14px}
.prog-wrap{height:4px;background:#1E3A5F;margin-top:8px;border-radius:2px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--accent),#38BDF8);width:0%;transition:width .4s;border-radius:2px}
/* MAIN AREA */
.main-area{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 14px 30px;max-width:860px;margin:0 auto;width:100%}
/* MODE LABEL */
.mode-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:10px;margin-bottom:10px;align-self:flex-start}
.mode-label.main-lbl{background:#EFF6FF;color:var(--accent)}
.mode-label.retry-lbl{background:#FEF3C7;color:var(--amber)}
/* NAV */
.nav-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;width:100%;justify-content:center}
.nav-btn{background:var(--accent);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0;line-height:1}
.nav-btn:hover{background:#0369A1}
.nav-btn:disabled{background:#CBD5E1;cursor:not-allowed}
.counter{font-size:14px;font-weight:700;color:var(--muted);min-width:90px;text-align:center}
/* DOTS */
.dots-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;max-width:540px}
.dot-item{width:10px;height:10px;border-radius:50%;background:#CBD5E1;cursor:pointer;transition:background .2s,transform .2s;flex-shrink:0}
.dot-item.active{transform:scale(1.35)}
.dot-item.main-active{background:var(--accent)}
.dot-item.retry-active{background:var(--amber)}
.dot-item.ok{background:var(--green)}
.dot-item.err{background:var(--red)}
/* CARD */
.card-viewport{width:100%;overflow:hidden}
.cards-track{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1)}
.task-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:20px;flex:0 0 100%;transition:border-color .3s}
.task-card.ok-card{border-color:var(--green)}
.task-card.err-card{border-color:var(--red)}
.task-hdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.task-num{background:linear-gradient(135deg,var(--accent),#0369A1);color:#fff;border-radius:7px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:2px}
.task-num.retry-num{background:linear-gradient(135deg,var(--amber),#B45309)}
.task-q{font-size:13px;color:var(--muted);line-height:1.5}
.mtable{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.mtable th{padding:6px 10px;text-align:left;background:#EFF6FF;font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid var(--border)}
.mtable td{padding:6px 10px;vertical-align:top;border:1px solid var(--border);line-height:1.55}
.mtable .lc{width:36%;font-weight:600;background:#FAFBFF}
.inp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.inp-g{display:flex;align-items:center;gap:6px}
.inp-lbl{font-size:13px;font-weight:700;min-width:20px}
.minp{width:42px;height:38px;text-align:center;font-size:18px;font-weight:700;border:2px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;font-family:'Courier New',monospace;transition:border-color .2s,background .2s}
.minp:focus{border-color:var(--accent)}
.minp.ok{border-color:var(--green);background:var(--gbg);color:var(--green)}
.minp.err{border-color:var(--red);background:var(--rbg);color:var(--red)}
.minp:disabled{opacity:.9}
.chk-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s}
.chk-btn:hover:not(:disabled){background:#0369A1}
.chk-btn:disabled{background:#CBD5E1;cursor:not-allowed}
.badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:10px;display:none}
.badge.ok{background:var(--gbg);color:var(--green);display:inline-block}
.badge.err{background:var(--rbg);color:var(--red);display:inline-block}
/* RESULTS PANEL */
.results-panel{display:none;flex-direction:column;align-items:center;width:100%;padding:10px 0}
.results-panel.show{display:flex}
.res-card{background:var(--card);border-radius:16px;padding:28px 24px;width:100%;max-width:500px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.07)}
.res-pct{font-size:56px;font-weight:800;line-height:1;margin:10px 0 4px}
.res-pct.p100{color:var(--green)}
.res-pct.phigh{color:#0284C7}
.res-pct.plow{color:var(--red)}
.res-label{font-size:14px;color:var(--muted);margin-bottom:18px}
.res-detail{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.res-btn{border:none;border-radius:10px;padding:11px 22px;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.res-btn.retry{background:#FEF3C7;color:var(--amber)}
.res-btn.retry:hover{background:#FDE68A}
.res-btn.again{background:#EFF6FF;color:var(--accent)}
.res-btn.again:hover{background:#DBEAFE}
.res-btn.finish{background:var(--gbg);color:var(--green)}
/* ═══ ОКСИДЫ ═══ */
.ox-section{max-width:860px;margin:0 auto;padding:10px 14px 50px;width:100%}
.ox-divider{display:flex;align-items:center;gap:12px;margin:24px 0 18px}
.ox-divider-line{flex:1;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.ox-divider-title{font-size:20px;font-weight:800;color:var(--hero);white-space:nowrap}
.ox-block{margin-bottom:28px}
.ox-block-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none}
.ox-block-num{background:var(--accent);color:#fff;border-radius:50%;width:28px;height:28px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ox-block-title{font-size:16px;font-weight:800;color:var(--hero)}
.ox-block-toggle{margin-left:auto;font-size:18px;color:var(--muted);transition:transform .25s}
.ox-block-toggle.open{transform:rotate(180deg)}
.ox-block-body{display:none}
.ox-block-body.open{display:block}
/* template */
.ox-tpl{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.ox-tpl-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:7px}
.ox-tpl-formula{font-size:clamp(13px,2.5vw,15px);font-weight:700;color:var(--hero);line-height:1.8;margin-bottom:8px}
.ox-tpl-formula .hia{color:var(--accent)}
.ox-tpl-formula .hib{color:#DC2626}
.ox-tpl-formula .hic{color:var(--green)}
.ox-tpl-formula .hip{color:#7C3AED}
.ox-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ox-pill{background:#fff;border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11.5px;font-family:'Courier New',monospace}
.ox-note{font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
/* practice */
.ox-practice-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.ox-practice-lbl::before,.ox-practice-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
/* reaction */
.ox-rxn{background:var(--card);border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:8px;transition:border-color .2s}
.ox-rxn.ox-revealed{border-color:#A7F3D0}
.ox-rxn-num{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px}
.ox-rxn-eq{font-size:clamp(13px,2.3vw,15px);font-family:'Courier New',monospace;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:3px}
.ox-rxn-arrow{color:var(--accent);margin:0 4px;font-size:16px}
.ox-rxn-right{display:none;color:var(--green);font-weight:700}
.ox-rxn-right.show{display:inline}
.ox-rxn-ph{color:#CBD5E1;font-style:italic;font-size:12px}
.ox-rxn-ph.hide{display:none}
.ox-rxn-btns{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.ox-btn-hint{background:#FFFBEB;color:#D97706;border:1.5px solid #FDE68A;border-radius:7px;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer}
.ox-btn-hint:hover{background:#FDE68A}
.ox-btn-ans{background:#EFF6FF;color:var(--accent);border:1.5px solid var(--border);border-radius:7px;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer}
.ox-btn-ans:hover{background:#DBEAFE}
.ox-btn-ans.done{background:var(--gbg);color:var(--green);border-color:#A7F3D0}
.ox-rxn-hint{display:none;margin-top:7px;font-size:11.5px;color:#92400E;background:#FFFBEB;border-radius:6px;padding:6px 10px;border-left:3px solid #FCD34D;line-height:1.5}
.ox-rxn-hint.show{display:block}
.ox-cond{font-size:9px;font-weight:700;color:#7C3AED;background:#F5F3FF;border-radius:3px;padding:1px 4px;margin-left:2px;vertical-align:super}
</style>
</head>

  </div>
</div>

/* ============ STATE ============ */
let secs=0,timerInv=null;
let mode='main'; // 'main' | 'retry'
let curIdx=0;

// main round
const TOTAL=T.length;
let mainChecked=0,mainOk=0;
const mainDots=[];
const mainInputRefs=[];
// which tasks have errors (ids)
let errIds=new Set();

// retry round
let retryTasks=[];
let retryChecked=0,retryOk=0;
const retryDots=[];
const retryInputRefs=[];

/* ============ TIMER / STATS ============ */
function startTimer(){
  timerInv=setInterval(()=>{
    secs++;
    const m=String(Math.floor(secs/60)).padStart(2,'0');
    const s=String(secs%60).padStart(2,'0');
    document.getElementById('tmr').textContent=m+':'+s;
  },1000);
}

function updateStats(){
  const ok=mode==='main'?mainOk:(TOTAL-errIds.size+retryOk);
  const checked=mode==='main'?mainChecked:(mainChecked); // header always shows main progress
  const pct=Math.round(mainChecked/TOTAL*100);
  document.getElementById('sOk').textContent=mainOk;
  document.getElementById('sErr').textContent=errIds.size;
  document.getElementById('sLeft').textContent=TOTAL-mainChecked;
  document.getElementById('sPct').textContent=pct+'%';
  document.getElementById('pgbar').style.width=pct+'%';
}

/* ============ CAROUSEL NAV ============ */
function goTo(idx,dots,inputRefs,total){
  curIdx=idx;
  document.getElementById('track').style.transform=`translateX(-${curIdx*100}%)`;
  document.getElementById('counter').textContent=`${curIdx+1} / ${total}`;
  document.getElementById('prev').disabled=curIdx===0;
  document.getElementById('next').disabled=curIdx===total-1;
  dots.forEach((d,i)=>{
    d.classList.remove('main-active','retry-active');
    d.classList.toggle('active',i===curIdx);
    if(i===curIdx)d.classList.add(mode==='main'?'main-active':'retry-active');
  });
  const inps=inputRefs[curIdx];
  if(inps){const f=inps.find(i=>!i.disabled&&!i.value);if(f)setTimeout(()=>f.focus(),350);}
}
function navigate(dir){
  const dots=mode==='main'?mainDots:retryDots;
  const refs=mode==='main'?mainInputRefs:retryInputRefs;
  const total=mode==='main'?TOTAL:retryTasks.length;
  goTo(curIdx+dir<0?0:curIdx+dir>=total?total-1:curIdx+dir,dots,refs,total);
}

/* ============ BUILD CARD ============ */
function buildCard(task,idx,isRetry){
  const dots=isRetry?retryDots:mainDots;
  const inputRefs=isRetry?retryInputRefs:mainInputRefs;
  const total=isRetry?retryTasks.length:TOTAL;

  const card=document.createElement('div');
  card.className='task-card';

  card.innerHTML=`<div class="task-hdr">
    <span class="task-num${isRetry?' retry-num':''}">№${task.id}</span>
    <span class="task-q">Установите соответствие — ${task.q}</span>
  </div>`;

  const tbl=document.createElement('table');
  tbl.className='mtable';
  tbl.innerHTML=`<tr><th>${task.lh}</th><th>${task.rh}</th></tr>`;
  const rows=Math.max(task.L.length,task.R.length);
  for(let i=0;i<rows;i++){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="lc">${task.L[i]||''}</td><td>${task.R[i]||''}</td>`;
    tbl.appendChild(tr);
  }
  card.appendChild(tbl);

  const row=document.createElement('div');row.className='inp-row';
  const lbls=['А','Б','В'];
  const inputs=[];
  lbls.forEach((l,i)=>{
    const g=document.createElement('div');g.className='inp-g';
    const inp=document.createElement('input');
    inp.type='text';inp.className='minp';inp.maxLength=1;inp.placeholder='';
    inp.addEventListener('input',e=>{
      e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(-1);
      if(e.target.value&&i<2)inputs[i+1].focus();
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter')btn.click();
      if(e.key==='Backspace'&&!e.target.value&&i>0)inputs[i-1].focus();
    });
    inputs.push(inp);
    g.innerHTML=`<span class="inp-lbl">${l}:</span>`;
    g.appendChild(inp);row.appendChild(g);
  });
  inputRefs[idx]=inputs;

  const btn=document.createElement('button');
  btn.className='chk-btn';btn.textContent='Проверить';
  const badge=document.createElement('span');badge.className='badge';

  btn.onclick=()=>{
    const ua=inputs.map(i=>i.value).join('');
    if(ua.length<3){inputs.find(i=>!i.value)?.focus();return;}
    const ans=task.ans;
    let allOk=true;
    inputs.forEach((inp,i)=>{
      inp.classList.remove('ok','err');
      inp.classList.add(inp.value===ans[i]?'ok':'err');
      if(inp.value!==ans[i])allOk=false;
    });

    if(allOk){
      inputs.forEach(i=>i.disabled=true);btn.disabled=true;
      card.classList.add('ok-card');
      badge.className='badge ok';badge.textContent='✓ Верно';badge.style.display='inline-block';
      dots[idx].classList.remove('active','main-active','retry-active');dots[idx].classList.add('ok');
      if(isRetry){
        retryChecked++;retryOk++;
        errIds.delete(task.id);
        if(retryChecked===retryTasks.length){setTimeout(showResults,700);}
        else if(curIdx<retryTasks.length-1){setTimeout(()=>navigate(1),900);}
      } else {
        mainChecked++;mainOk++;
        errIds.delete(task.id);
        updateStats();
        if(mainChecked===TOTAL){setTimeout(showResults,700);}
        else if(curIdx<TOTAL-1){setTimeout(()=>navigate(1),900);}
      }
    } else {
      badge.className='badge err';badge.style.display='inline-block';
      if(isRetry){
        badge.textContent='✗ Ошибка — попробуй ещё';
        setTimeout(()=>{
          inputs.forEach((inp,i)=>{if(inp.value!==ans[i]){inp.classList.remove('err');inp.value='';}});
          badge.style.display='none';
          inputs.find(i=>!i.disabled&&!i.value)?.focus();
        },1600);
      } else {
        badge.textContent='✗ Ошибка';
        inputs.forEach(i=>i.disabled=true);btn.disabled=true;
        card.classList.add('err-card');
        dots[idx].classList.remove('active','main-active','retry-active');dots[idx].classList.add('err');
        errIds.add(task.id);
        mainChecked++;
        updateStats();
        if(mainChecked===TOTAL){setTimeout(showResults,700);}
        else if(curIdx<TOTAL-1){setTimeout(()=>navigate(1),900);}
      }
    }
  };
  row.appendChild(btn);row.appendChild(badge);
  card.appendChild(row);
  return card;
}

/* ============ RESULTS PANEL ============ */
function showResults(){
  // hide carousel controls
  document.getElementById('prev').style.visibility='hidden';
  document.getElementById('next').style.visibility='hidden';
  document.getElementById('counter').style.visibility='hidden';
  document.getElementById('dots').style.display='none';
  document.getElementById('track').parentElement.style.display='none';

  const correct=TOTAL-errIds.size;
  const pct=Math.round(correct/TOTAL*100);

  const pctEl=document.getElementById('resPct');
  pctEl.textContent=pct+'%';
  pctEl.className='res-pct '+(pct===100?'p100':pct>=70?'phigh':'plow');

  document.getElementById('resLabel').textContent='заданий выполнено верно';

  const m=String(Math.floor(secs/60)).padStart(2,'0');
  const s=String(secs%60).padStart(2,'0');
  document.getElementById('resDetail').innerHTML=
    `Верно: <b>${correct} из ${TOTAL}</b>${errIds.size>0?` · Ошибок: <b>${errIds.size}</b>`:''}<br>Время: <b>${m}:${s}</b>`;

  const btns=document.getElementById('resBtns');
  btns.innerHTML='';

  if(errIds.size>0){
    const rb=document.createElement('button');
    rb.className='res-btn retry';
    rb.textContent=`⟳ Отработать ошибки (${errIds.size})`;
    rb.onclick=startRetry;
    btns.appendChild(rb);
  }

  const ag=document.createElement('button');
  ag.className='res-btn again';
  ag.textContent='↺ Пройти заново';
  ag.onclick=resetAll;
  btns.appendChild(ag);

  if(pct===100){
    clearInterval(timerInv);
    const fin=document.createElement('button');
    fin.className='res-btn finish';
    fin.textContent='✓ Отлично! 100%';
    fin.disabled=true;
    btns.prepend(fin);
  }

  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

/* ============ RETRY ============ */
function startRetry(){
  document.getElementById('results').classList.remove('show');
  retryTasks=T.filter(t=>errIds.has(t.id));
  retryChecked=0;retryOk=0;
  retryDots.length=0;retryInputRefs.length=0;
  mode='retry';curIdx=0;

  // rebuild track
  const track=document.getElementById('track');
  track.innerHTML='';
  const dotsEl=document.getElementById('dots');
  dotsEl.innerHTML='';
  // clear old main dots array (keep refs for display only)
  mainDots.length=0;

  retryTasks.forEach((t,i)=>{
    track.appendChild(buildCard(t,i,true));
    const d=document.createElement('div');
    d.className='dot-item'+(i===0?' active retry-active':'');
    d.title=`№${t.id}`;d.onclick=()=>goTo(i,retryDots,retryInputRefs,retryTasks.length);
    dotsEl.appendChild(d);retryDots.push(d);
  });

  document.getElementById('modeLbl').textContent='Отработка ошибок';
  document.getElementById('modeLbl').className='mode-label retry-lbl';
  document.getElementById('prev').style.visibility='';
  document.getElementById('next').style.visibility='';
  document.getElementById('counter').style.visibility='';
  document.getElementById('dots').style.display='';
  document.getElementById('track').parentElement.style.display='';

  goTo(0,retryDots,retryInputRefs,retryTasks.length);
}

/* ============ RESET ============ */
function resetAll(){
  document.getElementById('results').classList.remove('show');
  secs=0;document.getElementById('tmr').textContent='00:00';
  clearInterval(timerInv);
  mode='main';curIdx=0;mainChecked=0;mainOk=0;errIds=new Set();
  mainDots.length=0;mainInputRefs.length=0;

  const track=document.getElementById('track');track.innerHTML='';
  const dotsEl=document.getElementById('dots');dotsEl.innerHTML='';

  T.forEach((t,i)=>{
    track.appendChild(buildCard(t,i,false));
    const d=document.createElement('div');
    d.className='dot-item'+(i===0?' active main-active':'');
    d.title=`№${t.id}`;d.onclick=()=>goTo(i,mainDots,mainInputRefs,TOTAL);
    dotsEl.appendChild(d);mainDots.push(d);
  });

  document.getElementById('modeLbl').textContent='Основной прогон';
  document.getElementById('modeLbl').className='mode-label main-lbl';
  document.getElementById('prev').style.visibility='';
  document.getElementById('next').style.visibility='';
  document.getElementById('counter').style.visibility='';
  document.getElementById('dots').style.display='';
  document.getElementById('track').parentElement.style.display='';

  updateStats();
  goTo(0,mainDots,mainInputRefs,TOTAL);
  startTimer();
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded',()=>{
  const track=document.getElementById('track');
  const dotsEl=document.getElementById('dots');
  T.forEach((t,i)=>{
    track.appendChild(buildCard(t,i,false));
    const d=document.createElement('div');
    d.className='dot-item'+(i===0?' active main-active':'');
    d.title=`№${t.id}`;d.onclick=()=>goTo(i,mainDots,mainInputRefs,TOTAL);
    dotsEl.appendChild(d);mainDots.push(d);
  });
  goTo(0,mainDots,mainInputRefs,TOTAL);
  updateStats();
  startTimer();
});

document.addEventListener('keydown',e=>{
  if(document.activeElement?.tagName==='INPUT')return;
  if(e.key==='ArrowRight')navigate(1);
  if(e.key==='ArrowLeft')navigate(-1);
});
</script>

/* ══════════ RENDER ОКСИДЫ ══════════ */
function renderOxBlocks(){
  const container=document.getElementById('ox-blocks');
  if(!container)return;
  OX.forEach((block,bi)=>{
    const wrap=document.createElement('div');
    wrap.className='ox-block';

    const body=document.createElement('div');
    body.className='ox-block-body'+(bi===0?' open':'');

    const togSpan=document.createElement('div');
    togSpan.className='ox-block-toggle'+(bi===0?' open':'');
    togSpan.textContent='▼';

    const hdr=document.createElement('div');
    hdr.className='ox-block-hdr';
    const numEl=document.createElement('div');
    numEl.className='ox-block-num';numEl.textContent=bi+1;
    const ttlEl=document.createElement('div');
    ttlEl.className='ox-block-title';ttlEl.textContent=block.title;
    hdr.appendChild(numEl);hdr.appendChild(ttlEl);hdr.appendChild(togSpan);
    hdr.onclick=()=>{body.classList.toggle('open');togSpan.classList.toggle('open');};

    // template
    const tpl=document.createElement('div');
    tpl.className='ox-tpl';
    const pills=block.pills.map(p=>`<span class="ox-pill">${p}</span>`).join('');
    tpl.innerHTML=`<div class="ox-tpl-lbl">Шаблон</div>
      <div class="ox-tpl-formula">${block.tpl}</div>
      <div class="ox-pills">${pills}</div>
      <div class="ox-note">${block.note}</div>`;
    body.appendChild(tpl);

    // practice
    const pLbl=document.createElement('div');
    pLbl.className='ox-practice-lbl';
    pLbl.textContent='Практика — допиши продукты и коэффициенты';
    body.appendChild(pLbl);

    block.rxns.forEach((rxn,ri)=>{
      const id=`ox_${bi}_${ri}`;
      const div=document.createElement('div');
      div.className='ox-rxn';div.id='oxrxn_'+id;
      div.innerHTML=`<div class="ox-rxn-num">${ri+1} из ${block.rxns.length}</div>
        <div class="ox-rxn-eq">
          <span>${rxn.l}</span>
          <span class="ox-rxn-arrow">→</span>
          <span class="ox-rxn-right" id="oxr_${id}">${rxn.r}</span>
          <span class="ox-rxn-ph" id="oxph_${id}">? ? ?</span>
        </div>
        <div class="ox-rxn-btns">
          <button class="ox-btn-hint" onclick="oxHint('${id}')">💡 Подсказка</button>
          <button class="ox-btn-ans" id="oxbtn_${id}" onclick="oxAns('${id}')">✓ Показать ответ</button>
        </div>
        <div class="ox-rxn-hint" id="oxhint_${id}">${rxn.h}</div>`;
      body.appendChild(div);
    });

    wrap.appendChild(hdr);
    wrap.appendChild(body);
    container.appendChild(wrap);
  });
}
document.addEventListener('DOMContentLoaded', renderOxBlocks);

function oxHint(id){document.getElementById('oxhint_'+id).classList.toggle('show');}
function oxAns(id){
  document.getElementById('oxr_'+id).classList.add('show');
  document.getElementById('oxph_'+id).classList.add('hide');
  const btn=document.getElementById('oxbtn_'+id);
  btn.classList.add('done');btn.textContent='✓ Показано';btn.disabled=true;
  document.getElementById('oxrxn_'+id).classList.add('ox-revealed');
}
</script>
