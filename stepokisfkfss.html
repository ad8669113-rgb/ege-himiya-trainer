    <style>
        :root {
            --bg: #F6F5FC;
            --surface: #ffffff;
            --surface2: #F0EEFF;
            --ink: #1C1B29;
            --ink2: #3E3C5A;
            --muted: #8A88A8;
            --border: #E2E5EC;
            --p500: #7B61DB;
            --p600: #6248C4;
            --p700: #4E35A0;
            --p800: #3D2785;
            --p100: #F0EEFF;
            --green: #1D9E75;
            --green-t: #E1F5EE;
            --green-d: #085041;
            --red: #A32D2D;
            --red-t: #FCEBEB;
            --red-d: #7A2020;
            --amber: #BA7517;
            --amber-t: #FAEEDA;
            --amber-d: #633806;
            --blue: #2563EB;
            --blue-soft: #DBEAFE;
            --r: 12px;
            --rs: 8px;
            --shadow: 0 1px 3px rgba(20,21,26,.06), 0 4px 16px rgba(20,21,26,.06);
            --shm: 0 4px 20px rgba(60,40,160,.12);
            --mono: 'Courier New', monospace;
            --font: 'Segoe UI', system-ui, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            font-size: 15px;
            padding: 20px;
            min-height: 100vh;
        }
        .shell { max-width: 900px; margin: 0 auto; }

        .hero {
            background: linear-gradient(135deg, #2D1B69, #4E35A0 55%, #7B61DB 100%);
            padding: 28px 24px;
            border-radius: var(--r);
            margin-bottom: 24px;
            color: #fff;
        }
        .hero h1 {
            font-size: clamp(24px, 3.5vw, 34px);
            font-weight: 800;
            letter-spacing: -.02em;
            margin-bottom: 4px;
        }
        .hero h1 em { color: #BDB2F3; font-style: normal; }
        .hero p { color: rgba(255,255,255,.75); font-size: 15px; }
        .hero .stats {
            display: flex;
            gap: 14px;
            margin-top: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            color: rgba(255,255,255,.8);
        }
        .hero .stats span { background: rgba(255,255,255,.12); padding: 3px 12px; border-radius: 20px; }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: color .15s, border-color .15s;
            border-radius: 0;
        }
        .tab-btn:hover { color: var(--p700); }
        .tab-btn.active { color: var(--p700); border-bottom-color: var(--p500); }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .trainer-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 22px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
        }
        .stat-item .num { font-size: 18px; font-weight: 800; }
        .stat-item .num.green { color: var(--green); }
        .stat-item .num.red { color: var(--red); }
        .stat-item .num.gray { color: var(--muted); }
        .stat-item .num.amber { color: var(--amber); }
        .progress-track {
            flex: 1;
            min-width: 80px;
            height: 5px;
            background: var(--surface2);
            border-radius: 100px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--p500), var(--green));
            width: 0;
            transition: width .3s ease;
        }

        .task-prompt {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .task-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px 10px;
            margin: 8px 0 12px;
            font-size: 14px;
        }
        .task-grid .cell { padding: 3px 0; border-bottom: 1px dashed var(--border); }
        .task-grid .cell .label { font-weight: 700; color: var(--p700); margin-right: 5px; }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px 10px;
            margin: 6px 0 12px;
            font-size: 13px;
            background: var(--surface2);
            padding: 8px 12px;
            border-radius: var(--rs);
        }
        .options-grid .opt .num { font-weight: 700; color: var(--p700); margin-right: 3px; }

        .task-formula {
            font-family: var(--mono);
            font-size: 22px;
            font-weight: 700;
            background: var(--surface2);
            padding: 10px 16px;
            border-radius: var(--rs);
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: .04em;
        }
        .task-formula .hl { color: var(--amber); border-bottom: 2.5px solid var(--amber); padding-bottom: 1px; }
        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 100px;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-left: 4px;
        }
        .badge-ion { background: #EDE9FE; color: #7C3AED; }
        .badge-bracket { background: var(--green-t); color: var(--green-d); }
        .badge-simple { background: var(--amber-t); color: var(--amber-d); }
        .badge-acid { background: #FEF3C7; color: #92400E; }
        .badge-ammonium { background: #DBEAFE; color: #1E40AF; }
        .badge-penalty { background: var(--red-t); color: var(--red-d); }
        .badge-retry { background: var(--amber-t); color: var(--amber-d); }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 8px 0 10px;
        }
        .input-row input {
            padding: 9px 14px;
            font-size: 17px;
            font-family: var(--mono);
            border: 2px solid var(--border);
            border-radius: var(--rs);
            background: var(--bg);
            color: var(--ink);
            outline: none;
            transition: border-color .2s;
            max-width: 170px;
            width: 100%;
        }
        .input-row input:focus { border-color: var(--p500); }
        .input-row input.ok { border-color: var(--green); background: var(--green-t); }
        .input-row input.err { border-color: var(--red); background: var(--red-t); }
        .input-row input:read-only { opacity: .7; }
        .input-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

        .btn {
            padding: 9px 22px;
            border: none;
            border-radius: var(--rs);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: var(--p600);
            color: #fff;
            transition: background .15s, transform .1s;
            white-space: nowrap;
        }
        .btn:hover { background: var(--p700); transform: translateY(-1px); }
        .btn:disabled { opacity: .5; cursor: default; transform: none; }
        .btn-success { background: var(--green); }
        .btn-success:hover { background: var(--green-d); }
        .btn-danger { background: var(--red); }
        .btn-danger:hover { background: var(--red-d); }
        .btn-secondary { background: var(--surface2); color: var(--p700); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }

        .feedback {
            font-size: 14px;
            font-weight: 600;
            min-height: 22px;
            margin: 4px 0 10px;
        }
        .feedback.ok { color: var(--green); }
        .feedback.err { color: var(--red); }
        .feedback.info { color: var(--p700); }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .nav-row .nav-btns { display: flex; gap: 6px; }
        .nav-row .nav-btns button {
            min-width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 17px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--ink);
            cursor: pointer;
            transition: background .15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-row .nav-btns button:hover:not(:disabled) { background: var(--surface2); }
        .nav-row .nav-btns button:disabled { opacity: .3; cursor: default; }

        .result-box {
            background: var(--surface);
            border-radius: var(--r);
            padding: 28px 22px;
            text-align: center;
            box-shadow: var(--shm);
            border: 1px solid var(--border);

        .result-box .pct { font-size: 44px; font-weight: 900; color: var(--p700); }
        .result-box .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 14px 0 20px;
            flex-wrap: wrap;
        }
        .result-box .stats .num { font-size: 26px; font-weight: 800; }
        .result-box .stats .label { font-size: 13px; color: var(--muted); }
        .result-box .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .error-mode-badge {
            background: var(--red-t);
            border: 2px solid var(--red);
            border-radius: var(--r);
            padding: 10px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-weight: 700;
            color: var(--red-d);
        }

        @media(max-width:600px) {
            .hero { padding: 20px 16px; }
            .task-grid { grid-template-columns: 1fr; }
            .options-grid { grid-template-columns: 1fr; }
            .input-row input { max-width: 100%; }
            .nav-row { flex-direction: column; align-items: stretch; }
            .nav-row .nav-btns { justify-content: center; }
            .tabs .tab-btn { padding: 8px 12px; font-size: 13px; }
        }

    // Перемешиваем задания по С.О.
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    const soTasks = shuffleArray(soTasksRaw);

    // ═══════════════════════════════════════════════════════════
    // 3. УНИВЕРСАЛЬНЫЙ ДВИЖОК ДЛЯ ОБОИХ РЕЖИМОВ
    // ═══════════════════════════════════════════════════════════

    const states = { classify: null, so: null };

    function createState(tasks, type, mainCount) {
        const shuffled = shuffleArray([...tasks]);
        const main = shuffled.slice(0, mainCount);
        const penalty = shuffled.slice(mainCount);

        return {
            tasks: tasks,
            type: type,
            mainTasks: main,
            penaltyTasks: penalty,
            queue: main.map((t, i) => ({ ...t, from: 'main', idx: i })),
            pos: 0,
            correct: 0,
            wrong: 0,
            answered: new Set(),
            wrongSet: new Set(),
            penaltyUsed: 0,
            totalMain: main.length,
            totalPenalty: penalty.length,
            mode: 'main',
            timerSec: 0,
            timerInt: null,
            retryQueue: [],
            retryPos: 0,
            retryCorrect: 0,
            retryAnswered: new Set(),
        };
    }

    function getState(mode) {
        if (!states[mode]) {
            const tasks = mode === 'classify' ? classifyTasks : soTasks;
            const mainCount = mode === 'classify' ? 50 : 110;
            states[mode] = createState(tasks, mode, mainCount);
            const s = states[mode];
            s.timerInt = setInterval(() => {
                s.timerSec++;
                if (s.mode === 'main' || s.mode === 'retry') {
                    const container = document.getElementById(mode === 'classify' ? 'classify-app' : 'so-app');
                    if (container) {
                        const timeEl = container.querySelector('.stat-item:last-child .num');
                        if (timeEl) timeEl.textContent = fmtTime(s.timerSec);
                    }
                }
            }, 1000);
        }
        return states[mode];
    }

    function fmtTime(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

    function getBadgeLabel(badge) {
        if (!badge) return '';
        const map = { 'ion': 'ион', 'bracket': '( )', 'simple': 'простое', 'acid': 'кислая соль', 'ammonium': 'аммоний' };
        return map[badge] || '';
    }

    function getBadgeClass(badge) {
        if (!badge) return '';
        const map = { 'ion': 'badge-ion', 'bracket': 'badge-bracket', 'simple': 'badge-simple', 'acid': 'badge-acid',
            'ammonium': 'badge-ammonium' };
        return map[badge] || '';
    }

    function render(mode) {
        const state = getState(mode);
        const container = document.getElementById(mode === 'classify' ? 'classify-app' : 'so-app');
        if (!container) return;

        if (state.mode === 'done') {
            renderResult(mode, container);
            return;
        }

        if (state.mode === 'retry') {
            renderRetry(mode, container);
            return;
        }

        if (state.queue.length === 0) {
            state.mode = 'done';
            renderResult(mode, container);
            return;
        }

        const task = state.queue[state.pos];
        const queueLen = state.queue.length;
        const done = state.answered.size;
        const total = state.totalMain + state.penaltyUsed;
        const pct = done > 0 ? Math.round(state.correct / done * 100) : 0;
        const penaltyInQueue = state.queue.filter(t => t.from === 'penalty').length;

        let html = `
        <div class="stats-bar">
          <div class="stat-item">✅ <span class="num green">${state.correct}</span></div>
          <div class="stat-item">❌ <span class="num red">${state.wrong}</span></div>
          <div class="stat-item">📊 <span class="num gray">${done}/${total}</span></div>
          <div class="stat-item">🎯 <span class="num" style="color:var(--p700)">${pct}%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(done/total*100,100)}%"></div></div>
          <div class="stat-item">⏱️ <span class="num" style="color:var(--muted);font-size:16px">${fmtTime(state.timerSec)}</span></div>
        </div>
        <div class="trainer-wrap">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
            <span style="font-size:13px;color:var(--muted)">
              Задание ${state.pos+1} из ${queueLen}
              ${task.from === 'penalty' ? ' <span class="badge-penalty">⚡ штрафное</span>' : ''}
              ${state.wrongSet.has(task.id) ? ' <span class="badge-queue">🔄 повтор</span>' : ''}
            </span>
            <span style="font-size:13px;color:var(--muted)">
              ⚡ штрафных в очереди: ${penaltyInQueue} | всего: ${state.penaltyUsed}
            </span>
          </div>
        `;

        if (mode === 'classify') {
            html += `
            <div class="task-prompt">${task.prompt}</div>
            <div class="task-grid">
              <div class="cell"><span class="label">1)</span> ${task.a}</div>
              <div class="cell"><span class="label">2)</span> ${task.b}</div>
              <div class="cell"><span class="label">3)</span> ${task.c}</div>
              <div class="cell"><span class="label">4)</span> ${task.d}</div>
              <div class="cell"><span class="label">5)</span> ${task.e}</div>
              <div class="cell"><span class="label">6)</span> ${task.f}</div>
              <div class="cell"><span class="label">7)</span> ${task.g}</div>
              <div class="cell"><span class="label">8)</span> ${task.h}</div>
              <div class="cell"><span class="label">9)</span> ${task.i}</div>
            </div>
            <div style="font-size:13px;color:var(--muted);margin:4px 0 8px">Введите три цифры (А→Б→В), например 485</div>
            <div class="input-row">
              <input type="text" id="classify-input" placeholder="три цифры" maxlength="6" autocomplete="off">
              <button class="btn" id="classify-btn" onclick="checkAnswer('classify')">Проверить</button>
            </div>
            <div class="feedback" id="classify-feedback"></div>
          `;
        } else {
            const badge = task.badge || '';
            const badgeLabel = getBadgeLabel(badge);
            const badgeClass = getBadgeClass(badge);
            html += `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">`;
            if (badge) html += `<span class="badge ${badgeClass}">${badgeLabel}</span> `;
            html += `</div>`;
            html += `<div class="task-formula">${task.ask}</div>`;
            html += `<div class="input-row">
            <input type="text" id="so-input" placeholder="например +6" maxlength="6" autocomplete="off">
            <button class="btn" id="so-btn" onclick="checkAnswer('so')">Проверить</button>
          </div>
          <div class="input-hint">Введите степень окисления со знаком (+6 или -2)</div>
          <div class="feedback" id="so-feedback"></div>`;
        }

        html += `
          <div class="nav-row">
            <div class="nav-btns">
              <button onclick="goTo('${mode}', ${state.pos-1})" ${state.pos===0?'disabled':''}>←</button>
              <button onclick="goTo('${mode}', ${state.pos+1})" ${state.pos===queueLen-1?'disabled':''}>→</button>
            </div>
          </div>
        </div>
        `;

        container.innerHTML = html;

        const inp = document.getElementById(mode === 'classify' ? 'classify-input' : 'so-input');
        if (inp && !inp.readOnly) setTimeout(() => inp.focus(), 200);

        document.getElementById('hero-mode').textContent = `📚 Режим: ${mode === 'classify' ? 'Классификация' : 'Степень окисления'}`;
        document.getElementById('hero-total').textContent = `📚 Всего: ${total}`;
        document.getElementById('hero-queue').textContent = `⏳ В очереди: ${queueLen}`;
        document.getElementById('hero-errors').textContent = `❌ Ошибок: ${state.wrong}`;
    }

    // ═══════════════════════════════════════════════════════════
    // 4. ОСТАЛЬНЫЕ ФУНКЦИИ
    // ═══════════════════════════════════════════════════════════

    function checkAnswer(mode) {
        const state = getState(mode);
        if (state.mode === 'done' || state.mode === 'retry') return;
        if (state.queue.length === 0) { state.mode = 'done';
            render(mode); return; }

        const task = state.queue[state.pos];
        const inp = document.getElementById(mode === 'classify' ? 'classify-input' : 'so-input');
        const fb = document.getElementById(mode === 'classify' ? 'classify-feedback' : 'so-feedback');
        if (!inp || !fb) return;

        const raw = inp.value.trim();
        if (!raw) { inp.focus(); return; }

        let ok = false;
        let correctAnswer = '';

        if (mode === 'classify') {
            const digits = raw.replace(/[^0-9]/g, '');
            if (digits.length < 3) {
                fb.className = 'feedback info';
                fb.textContent = 'Введите ровно три цифры (например, 485)';
                return;
            }
            const user = digits.slice(0, 3).split('').map(Number);
            const corr = task.answer;
            ok = user[0] === corr[0] && user[1] === corr[1] && user[2] === corr[2];
            correctAnswer = task.full;
        } else {
            const normalized = raw.trim().replace(/−/g, '-').replace(/–/g, '-').replace(/\s/g, '');
            ok = normalized === task.ans;
            correctAnswer = task.ans;
        }

        inp.readOnly = true;
        document.getElementById(mode === 'classify' ? 'classify-btn' : 'so-btn').disabled = true;

        if (ok) {
            inp.classList.add('ok');
            fb.className = 'feedback ok';
            fb.textContent = `✅ Верно! ${correctAnswer}`;
            state.correct++;
            state.answered.add(task.id);
            state.queue.splice(state.pos, 1);
        } else {
            inp.classList.add('err');
            fb.className = 'feedback err';
            fb.textContent = `❌ Неверно. Правильно: ${correctAnswer}`;
            state.wrong++;
            state.wrongSet.add(task.id);

            const taskCopy = { ...task };
            state.queue.push(taskCopy);

            if (mode === 'classify') {
                if (state.penaltyTasks.length > 0 && state.penaltyUsed < state.totalPenalty) {
                    const penaltyTask = state.penaltyTasks[state.penaltyUsed];
                    state.queue.push({
                        ...penaltyTask,
                        from: 'penalty',
                        idx: state.penaltyUsed
                    });
                    state.penaltyUsed++;
                } else {
                    fb.textContent += ' ⚠️ Штрафные задания закончились!';
                }
            } else {
                fb.textContent += ' 🔄 Задание добавлено в конец очереди';
            }
        }

        if (state.queue.length === 0) {
            state.mode = 'done';
            setTimeout(() => render(mode), 500);
            return;
        }

        if (state.pos >= state.queue.length) state.pos = state.queue.length - 1;
        setTimeout(() => render(mode), 800);
    }

    function goTo(mode, newPos) {
        const state = getState(mode);
        if (state.mode === 'done' || state.mode === 'retry') return;
        if (newPos < 0 || newPos >= state.queue.length) return;
        state.pos = newPos;
        render(mode);
    }

    function renderResult(mode, container) {
        const state = getState(mode);
        const total = state.totalMain + state.penaltyUsed;
        const pct = total > 0 ? Math.round(state.correct / total * 100) : 0;
        const wrongCount = state.wrongSet.size;

        let html = `
        <div class="result-box">
          <div class="grade">${pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚'}</div>
          <div class="pct">${pct}%</div>
          <div class="stats">
            <div><div class="num" style="color:var(--green)">${state.correct}</div><div class="label">Верно</div></div>
            <div><div class="num" style="color:var(--red)">${state.wrong}</div><div class="label">Ошибок</div></div>
            ${mode === 'classify' ? `<div><div class="num" style="color:var(--amber)">${state.penaltyUsed}</div><div class="label">Штрафных</div></div>` : ''}
            <div><div class="num" style="color:var(--muted)">${fmtTime(state.timerSec)}</div><div class="label">Время</div></div>
          </div>
          <div class="actions">
        `;

        if (wrongCount > 0) {
            html += `<button class="btn btn-danger" onclick="startRetryMode('${mode}')">✏️ Работа над ошибками (${wrongCount})</button>`;
        } else {
            html += `<div style="color:var(--green);font-weight:700">✨ Все задания выполнены без ошибок!</div>`;
        }
        html += `<button class="btn btn-secondary" onclick="restartMode('${mode}')">🔄 Начать заново</button>`;
        html += `</div></div>`;

        container.innerHTML = html;

        document.getElementById('hero-mode').textContent = `📚 Режим: ${mode === 'classify' ? 'Классификация' : 'Степень окисления'}`;
        document.getElementById('hero-total').textContent = `📚 Всего: ${total}`;
        document.getElementById('hero-queue').textContent = `⏳ В очереди: 0`;
        document.getElementById('hero-errors').textContent = `❌ Ошибок: ${state.wrong}`;
    }

    function startRetryMode(mode) {
        const state = getState(mode);
        const wrongTasks = [];

        const allTasks = [...state.mainTasks, ...state.penaltyTasks.slice(0, state.penaltyUsed)];
        for (const task of allTasks) {
            if (state.wrongSet.has(task.id)) {
                wrongTasks.push({ ...task });
            }
        }

        if (wrongTasks.length === 0) {
            alert('Нет заданий для работы над ошибками!');
            return;
        }

        state.retryQueue = shuffleArray(wrongTasks);
        state.retryPos = 0;
        state.retryCorrect = 0;
        state.retryAnswered = new Set();
        state.mode = 'retry';

        state.savedQueue = [...state.queue];
        state.savedPos = state.pos;

        state.queue = state.retryQueue.map((t, i) => ({ ...t, from: 'retry', idx: i }));
        state.pos = 0;

        render(mode);
    }

    function renderRetry(mode, container) {
        const state = getState(mode);
        if (state.queue.length === 0) {
            state.mode = 'done';
            renderResult(mode, container);
            return;
        }

        const task = state.queue[state.pos];
        const queueLen = state.queue.length;

        let html = `
        <div class="error-mode-badge">
          <span style="font-size:20px">✏️</span>
          <span>Работа над ошибками · <strong>${state.pos+1}</strong> из ${queueLen}</span>
          <span style="margin-left:auto;font-weight:700;color:var(--green)">✅ ${state.retryCorrect} верно</span>
        </div>
        <div class="trainer-wrap">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
            <span style="font-size:13px;color:var(--muted)">Задание ${state.pos+1} из ${queueLen}</span>
          </div>
        `;

        if (mode === 'classify') {
            html += `
            <div class="task-prompt">${task.prompt}</div>
            <div class="task-grid">
              <div class="cell"><span class="label">1)</span> ${task.a}</div>
              <div class="cell"><span class="label">2)</span> ${task.b}</div>
              <div class="cell"><span class="label">3)</span> ${task.c}</div>
              <div class="cell"><span class="label">4)</span> ${task.d}</div>
              <div class="cell"><span class="label">5)</span> ${task.e}</div>
              <div class="cell"><span class="label">6)</span> ${task.f}</div>
              <div class="cell"><span class="label">7)</span> ${task.g}</div>
              <div class="cell"><span class="label">8)</span> ${task.h}</div>
              <div class="cell"><span class="label">9)</span> ${task.i}</div>
            </div>
            <div style="font-size:13px;color:var(--muted);margin:4px 0 8px">Введите три цифры (А→Б→В)</div>
            <div class="input-row">
              <input type="text" id="classify-retry-input" placeholder="три цифры" maxlength="6" autocomplete="off">
              <button class="btn" id="classify-retry-btn" onclick="checkRetry('classify')">Проверить</button>
            </div>
            <div class="feedback" id="classify-retry-feedback"></div>
          `;
        } else {
            const badge = task.badge || '';
            const badgeLabel = getBadgeLabel(badge);
            const badgeClass = getBadgeClass(badge);
            html += `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">`;
            if (badge) html += `<span class="badge ${badgeClass}">${badgeLabel}</span> `;
            html += `</div>`;
            html += `<div class="task-formula">${task.ask}</div>`;
            html += `<div class="input-row">
            <input type="text" id="so-retry-input" placeholder="например +6" maxlength="6" autocomplete="off">
            <button class="btn" id="so-retry-btn" onclick="checkRetry('so')">Проверить</button>
          </div>
          <div class="input-hint">Введите степень окисления со знаком</div>
          <div class="feedback" id="so-retry-feedback"></div>`;
        }

        html += `
          <div class="nav-row">
            <div class="nav-btns">
              <button onclick="retryGo('${mode}', ${state.pos-1})" ${state.pos===0?'disabled':''}>←</button>
              <button onclick="retryGo('${mode}', ${state.pos+1})" ${state.pos===queueLen-1?'disabled':''}>→</button>
            </div>
          </div>
        </div>
        `;

        container.innerHTML = html;

        const inp = document.getElementById(mode === 'classify' ? 'classify-retry-input' : 'so-retry-input');
        if (inp && !inp.readOnly) setTimeout(() => inp.focus(), 200);

        document.getElementById('hero-mode').textContent = `📚 Режим: ${mode === 'classify' ? 'Классификация' : 'Степень окисления'}`;
        document.getElementById('hero-queue').textContent = `⏳ В очереди: ${queueLen}`;
        document.getElementById('hero-errors').textContent = `❌ Ошибок: ${state.wrong}`;
    }

    function checkRetry(mode) {
        const state = getState(mode);
        if (state.mode !== 'retry') return;
        if (state.queue.length === 0) { state.mode = 'done';
            render(mode); return; }

        const task = state.queue[state.pos];
        const inp = document.getElementById(mode === 'classify' ? 'classify-retry-input' : 'so-retry-input');
        const fb = document.getElementById(mode === 'classify' ? 'classify-retry-feedback' : 'so-retry-feedback');
        if (!inp || !fb) return;

        const raw = inp.value.trim();
        if (!raw) { inp.focus(); return; }

        let ok = false;
        let correctAnswer = '';

        if (mode === 'classify') {
            const digits = raw.replace(/[^0-9]/g, '');
            if (digits.length < 3) {
                fb.className = 'feedback info';
                fb.textContent = 'Введите ровно три цифры';
                return;
            }
            const user = digits.slice(0, 3).split('').map(Number);
            const corr = task.answer;
            ok = user[0] === corr[0] && user[1] === corr[1] && user[2] === corr[2];
            correctAnswer = task.full;
        } else {
            const normalized = raw.trim().replace(/−/g, '-').replace(/–/g, '-').replace(/\s/g, '');
            ok = normalized === task.ans;
            correctAnswer = task.ans;
        }

        inp.readOnly = true;
        document.getElementById(mode === 'classify' ? 'classify-retry-btn' : 'so-retry-btn').disabled = true;

        if (ok) {
            inp.classList.add('ok');
            fb.className = 'feedback ok';
            fb.textContent = `✅ Верно! ${correctAnswer}`;
            state.retryCorrect++;
            state.retryAnswered.add(task.id);
            state.queue.splice(state.pos, 1);
        } else {
            inp.classList.add('err');
            fb.className = 'feedback err';
            fb.textContent = `❌ Неверно. Правильно: ${correctAnswer}`;
            // Добавляем в конец очереди для повторной попытки
            const taskCopy = { ...task };
            state.queue.push(taskCopy);
            // Проверяем, не зациклилось ли
            if (state.queue.length > 50) {
                fb.textContent += ' ⚠️ Слишком много ошибок. Начните заново.';
                state.mode = 'done';
                setTimeout(() => render(mode), 500);
                return;
            }
        }

        if (state.queue.length === 0) {
            state.mode = 'done';
            setTimeout(() => render(mode), 500);
            return;
        }

        if (state.pos >= state.queue.length) state.pos = state.queue.length - 1;
        setTimeout(() => render(mode), 800);
    }

    function retryGo(mode, newPos) {
        const state = getState(mode);
        if (state.mode !== 'retry') return;
        if (newPos < 0 || newPos >= state.queue.length) return;
        state.pos = newPos;
        render(mode);
    }

    function restartMode(mode) {
        const state = getState(mode);
        if (state.timerInt) { clearInterval(state.timerInt);
            state.timerInt = null; }

        const tasks = mode === 'classify' ? classifyTasks : soTasks;
        const mainCount = mode === 'classify' ? 50 : 110;
        const newState = createState(tasks, mode, mainCount);

        newState.timerInt = setInterval(() => {
            newState.timerSec++;
            if (newState.mode === 'main' || newState.mode === 'retry') {
                const container = document.getElementById(mode === 'classify' ? 'classify-app' : 'so-app');
                if (container) {
                    const timeEl = container.querySelector('.stat-item:last-child .num');
                    if (timeEl) timeEl.textContent = fmtTime(newState.timerSec);
                }
            }
        }, 1000);

        states[mode] = newState;
        render(mode);
    }

    // ═══════════════════════════════════════════════════════════
    // 5. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК И ИНИЦИАЛИЗАЦИЯ
    // ═══════════════════════════════════════════════════════════

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const tab = this.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.getElementById('pane-' + tab).classList.add('active');
            render(tab);
        });
    });

    // Инициализация
    render('classify');

    // Экспортируем функции
    window.checkAnswer = checkAnswer;
    window.goTo = goTo;
    window.startRetryMode = startRetryMode;
    window.restartMode = restartMode;
    window.checkRetry = checkRetry;
    window.retryGo = retryGo;
</script>
</body>
</html>
